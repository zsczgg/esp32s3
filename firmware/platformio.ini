; 云打印盒 · ESP32-C3
; 编译：pio run
; 烧录：pio run -t upload   （按住 BOOT 再插线，或直接插 USB 一般能自动进下载模式）
; 监视：pio device monitor

[env:esp32-c3-devkitm-1]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; 换板子时改这两处：
;   ESP32-C3 SuperMini / 第三方 C3 小板 -> board = esp32-c3-devkitm-1 一般也能用
;   ESP32-CAM（原版 ESP32 双模）      -> board = esp32cam
board_build.flash_mode = dio

; BLE + WiFi + HTTP 一起编，默认 1.25MB 的 app 分区装不下（实测要 1.55MB）
; 4MB flash 用 huge_app 分区，app 区给到 3MB
board_build.partitions = huge_app.csv

; C3 的 USB-Serial-JTAG 必须显式打开，否则 Arduino 的 Serial 走 UART0 引脚
; （GPIO21/20），板上 USB 口只能看到 ROM/panic 输出，看不到 Serial.printf
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_unflags =
    -DCORE_DEBUG_LEVEL=3

; ============================================================
; ESP32-S3 版（2026-11-24 起主用）
;   双核 240MHz：一个核跑蓝牙协议栈，一个核跑 WiFi + HTTP
;   338KB 空闲堆（C3 只有 162KB）
;   16MB Flash
; 烧录：pio run -e s3-print -t upload --upload-port COM6
; ============================================================
[env:s3-print]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

board_build.flash_mode = qio
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHAS_DISPLAY=0

; 无屏版不编译界面、屏幕驱动和定制字库（这三样都依赖 LVGL）
build_src_filter = +<*> -<ui.cpp> -<display_port.cpp> -<font_zh_16.c>

build_unflags =
    -DCORE_DEBUG_LEVEL=3

; ============================================================
; ESP32-S3 + 触摸屏版（带 LVGL 界面）
;   屏驱动/触摸引脚全部集中在 src/board_profile.h，换板只改那一个文件
;   烧录：pio run -e s3-lcd -t upload --upload-port COM6
;
;   ★ s3-lcd = 官方 LCDWiki 2.8" ESP32-S3 Display（ES3C28P）
;        ILI9341V 240x320 + FT6336G，引脚按 lcdwiki 原厂文档
;        CS=10 DC=46 SCLK=12 MOSI=11 MISO=13 BL=45 RST 与 EN 共用
;        触摸 SDA=16 SCL=15 RST=18 INT=17 @0x38
;
;   下面是同一块屏的几个保险变体，主环境不对时按现象挑一个：
;   s3-lcd-wiki-plain  背光 GPIO45 直流常高（怀疑 PWM 点不亮升压 EN 时用）
;   s3-lcd-wiki-noinv  不反色（画面发白、像底片时用）
;   s3-lcd-wiki-hi     横屏改竖屏（rotation 0）
;   s3-lcd-wiki-notouch 不初始化触摸（只想先看屏时用，排掉 I2C 干扰）
; ============================================================
[env:s3-lcd]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

board_build.flash_mode = qio
board_build.partitions = huge_app.csv

lib_deps =
    lvgl/lvgl@^8.4.0
    lovyan03/LovyanGFX@^1.1.16

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DHAS_DISPLAY=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DBOARD_PRESET=8
    -I src

build_unflags =
    -DCORE_DEBUG_LEVEL=3

[env:s3-lcd-wiki-plain]
extends = env:s3-lcd
build_flags = ${env:s3-lcd.build_flags} -DLCD_BL_PLAIN=1

[env:s3-lcd-wiki-noinv]
extends = env:s3-lcd
build_flags = ${env:s3-lcd.build_flags} -DLCD_INVERT_SET=0

[env:s3-lcd-wiki-portrait]
extends = env:s3-lcd
build_flags = ${env:s3-lcd.build_flags} -DLCD_ROTATION_SET=0

[env:s3-lcd-wiki-notouch]
extends = env:s3-lcd
build_flags = ${env:s3-lcd.build_flags} -DTOUCH_NONE=1

[env:s3-lcd-7789]
extends = env:s3-lcd
build_flags = ${env:s3-lcd.build_flags} -DBOARD_PRESET=3

[env:s3-lcd-7789-slow]
extends = env:s3-lcd
build_flags = ${env:s3-lcd.build_flags} -DBOARD_PRESET=3 -DLCD_SPI_HZ_SET=20000000

[env:s3-lcd-7796]
extends = env:s3-lcd
build_flags = ${env:s3-lcd.build_flags} -DBOARD_PRESET=2

