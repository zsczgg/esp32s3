; 纯 WiFi 诊断固件 —— 不含任何蓝牙代码
; 用途：把"C3 连不上路由器"这件事，与蓝牙共存彻底隔离
; 编译：pio run      烧录：pio run -t upload

[env:c3-wifi-only]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

board_build.flash_mode = dio
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_unflags =
    -DCORE_DEBUG_LEVEL=3

; ESP32-S3 版：同一份源码，不同板型。
; 用途：跟 C3 做对照实验 —— 同一个路由器、同样的代码，
;       如果 S3 能连上而 C3 不能，说明是 C3 那块板子的射频问题。
[env:s3-wifi-only]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

board_build.flash_mode = qio
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

build_unflags =
    -DCORE_DEBUG_LEVEL=3
