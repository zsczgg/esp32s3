; MAC 仿冒诊断 —— 区分"路由器白名单"与"板子发射坏"
[env:c3-macspoof]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

board_build.flash_mode = dio
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_unflags =
    -DCORE_DEBUG_LEVEL=3
